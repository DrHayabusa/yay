name: sanad_app
description: Sanad — vehicle breakdown recovery & repair (UAE). Customer-first, role-aware.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0 # tokens at rest in Keychain/Keystore
  geolocator: ^13.0.0 # GPS for breakdown location
  image_picker: ^1.1.0 # camera & gallery
  record: ^5.1.0 # voice notes
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
